name: Deploy AI Daily

on:
  push:
    branches:
      - main
    paths:
      - "data/reports/**"
      - "data/curation/**"
      - "data/curation-candidates/**"
      - "data/curation-sources.json"
      - "data/curation-rejections.json"
      - "data/sources.json"
      - "public/media/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/daily.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Review latest report
        run: npm run review

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
