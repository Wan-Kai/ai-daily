name: Publish Curation Approvals

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: curation-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Apply curation approvals and rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          AI_DAILY_MAX_APPROVED_PODCASTS_PER_RUN: "0"
        run: npm run curation:publish

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/curation data/curation-candidates data/curation-rejections.json
          git commit -m "发布精选内容审批结果"

      - name: Push changes
        if: steps.changes.outputs.changed == 'true'
        run: git push
